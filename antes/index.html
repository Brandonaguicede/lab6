<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { font: 16px Helvetica, Arial, sans-serif; padding: 76px 0 58px; color: #171717; }
      #auth-panel { position: fixed; inset: 0 0 auto; min-height: 64px; padding: 12px 16px; background: #102a43; color: #fff; display: flex; align-items: center; gap: 12px; z-index: 2; }
      #identity { flex: 1; font-weight: 700; }
      #auth-panel button { border: 1px solid #fff; border-radius: 4px; padding: 9px 14px; background: #fff; color: #102a43; cursor: pointer; }
      form { background: #000; padding: 6px; position: fixed; bottom: 0; width: 100%; display: flex; gap: 6px; }
      form input { border: 0; padding: 10px; min-width: 0; flex: 1; }
      form button { background: rgb(130, 224, 255); border: none; padding: 10px 16px; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages li { padding: 8px 10px; overflow-wrap: anywhere; }
      #messages li:nth-child(odd) { background: #eee; }
      #error { color: #a40000; min-height: 1.4em; padding: 6px 10px; }
      .chat-media { display: block; max-width: min(100%, 560px); max-height: 400px; margin-top: 6px; }
      .chat-player { width: min(100%, 560px); aspect-ratio: 16 / 9; border: 0; margin-top: 6px; }
      @media (max-width: 550px) { #auth-panel { align-items: flex-start; flex-wrap: wrap; } form button { padding: 10px; } }
    </style>
  </head>
  <body>
    <header id="auth-panel" aria-label="Sesion">
      <span id="identity" aria-live="polite">Sin autenticar</span>
      <button id="login" type="button">Iniciar sesion con Google</button>
      <button id="logout" type="button" hidden>Cerrar sesion</button>
    </header>
    <ul id="messages" aria-live="polite"></ul>
    <p id="error" role="alert" aria-live="assertive"></p>
    <form id="chat-form" hidden>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" aria-label="Mensaje" aria-describedby="error">
      <button type="submit">Enviar</button>
    </form>
    <script src="/runtime-config.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
